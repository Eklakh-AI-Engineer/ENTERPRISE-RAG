name: Enterprise RAG CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend:
    name: Backend smoke tests
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ci-test-key
      OPENROUTER_MODEL: ci-test-model

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python
        run: python -m compileall app scripts tests

      - name: Run smoke tests
        run: python -m pytest -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
