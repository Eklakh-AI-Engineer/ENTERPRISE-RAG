name: Phase 2 Silver Labels

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenRouter model
        required: false
        default: qwen/qwen3.8-27b:free

permissions:
  contents: write

jobs:
  silver-label:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ inputs.model || 'qwen/qwen3.8-27b:free' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install labeling dependency
        run: pip install requests
      - name: Verify secret is configured
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY GitHub secret is not configured."
            exit 1
          fi
      - name: Generate resumable silver labels
        run: |
          python scripts/label_phase2_silver.py \
            --pool data/evaluation/cha_pool_v1.json \
            --output data/evaluation/cha_silver_labels_v1.json
      - name: Commit silver-label checkpoint
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/evaluation/cha_silver_labels_v1.json
          git commit -m "data: checkpoint Phase 2 silver relevance labels [skip ci]" || exit 0
          git push